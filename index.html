  if(tot<cw*ch*.55){const seen=new Uint8Array(cw*ch);for(let i=0;i<cw*ch;i++){if(!on[i]||seen[i])continue;const q=[i];seen[i]=1;let x0=99,y0=99,x1=-1,y1=-1,n=0;while(q.length){const k=q.pop(),kx=k%cw,ky=(k/cw)|0;n++;x0=Math.min(x0,kx);x1=Math.max(x1,kx);y0=Math.min(y0,ky);y1=Math.max(y1,ky);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=kx+dx,ny=ky+dy;if(nx<0||ny<0||nx>=cw||ny>=ch)continue;const j=ny*cw+nx;if(on[j]&&!seen[j]){seen[j]=1;q.push(j)}}}
   if(n>=2)motion.push({n:'MOTION',s:.6,b:[x0/cw,y0/ch,(x1-x0+1)/cw,(y1-y0+1)/ch]})}}}

/* tracking */
function fuse(){const fresh=performance.now()-cocoT<900?cocoDet:[],dets=fresh.slice();

  if(!best){best={id:nid++,sim:false,cx:dx,cy:dy,w:d.b[2],h:d.b[3],vx:0,vy:0,trail:[],lock:0,age:0,friendly:false,dead:0,rng:200,ts:performance.now()};tracks.push(best);log('NEW TRACK TRK-'+pad(best.id)+' '+k[0],'k');beep(1000,.05)}

const col=t=>t.dead?'#888':t.friendly?'#3dff8a':t.thr>=3?'#ff3b3b':t.thr==2?'#ffb000':'#4de1ff';

/* radar */
function radar(dt){const s=R.width,c=s/2;sweep=(sweep+dt*2.1)%6.283;rx.clearRect(0,0,s,s);rx.fillStyle='rgba(0,20,10,.8)';rx.beginPath();rx.arc(c,c,c-2,0,6.283);rx.fill();rx.strokeStyle='rgba(61,255,138,.35)';rx.lineWidth=1.5;rx.font='20px monospace';rx.fillStyle='#3dff8a';
 for(let i=1;i<=4;i++){rx.beginPath();rx.arc(c,c,(c-2)*i/4,0,6.283);rx.stroke()}rx.beginPath();rx.moveTo(c,2);rx.lineTo(c,s-2);rx.moveTo(2,c);rx.lineTo(s-2,c);rx.stroke();
 rx.save();rx.translate(c,c);rx.rotate(-heading*Math.PI/180);for(let a=0;a<360;a+=30){rx.save();rx.rotate(a*Math.PI/180);rx.fillStyle=a==0?'#ff3b3b':'#3dff8a';rx.fillText(a==0?'N':a==90?'E':a==180?'S':a==270?'W':'',-6,-c+24);rx.beginPath();rx.moveTo(0,-c+2);rx.lineTo(0,-c+10);rx.stroke();rx.restore()}rx.restore();
 rx.fillStyle='rgba(61,255,138,.1)';rx.beginPath();rx.moveTo(c,c);rx.arc(c,c,c-2,-Math.PI/2-FOV/2*Math.PI/180,-Math.PI/2+FOV/2*Math.PI/180);rx.fill();
 const g=rx.createConicGradient?rx.createConicGradient(sweep-1.2,c,c):null;if(g){g.addColorStop(0,'rgba(61,255,138,0)');g.addColorStop(.19,'rgba(61,255,138,.5)');g.addColorStop(.2,'rgba(61,255,138,0)');rx.fillStyle=g;rx.beginPath();rx.arc(c,c,c-2,0,6.283);rx.fill()}
 rx.strokeStyle='#3dff8a';rx.lineWidth=2;rx.beginPath();rx.moveTo(c,c);rx.lineTo(c+Math.cos(sweep-1.2+1.2)*(c-2)*1,c+Math.sin(sweep)*(c-2));rx.stroke();
 for(const t of tracks){if(t.dead)continue;const rel=((t.bear-heading)*Math.PI/180),r=Math.log(1+Math.min(t.rng,4500))/Math.log(4501)*(c-6),bx=c+Math.sin(rel)*r,by=c-Math.cos(rel)*r;
  let ang=(Math.atan2(by-c,bx-c)+6.283)%6.283,age=((sweep-ang)%6.283+6.283)%6.283,al=Math.max(.25,1-age/6.283);rx.globalAlpha=al;rx.fillStyle=col(t);rx.beginPath();rx.arc(bx,by,t.sim?7:5,0,6.283);rx.fill();
  if(t.sim){rx.strokeStyle=col(t);rx.lineWidth=1.5;rx.beginPath();rx.moveTo(bx,by);rx.lineTo(bx-Math.sin(rel)*22,by+Math.cos(rel)*22);rx.stroke()}
  if(t.id===sel){rx.globalAlpha=1;rx.strokeStyle='#fff';rx.beginPath();rx.arc(bx,by,12,0,6.283);rx.stroke()}rx.globalAlpha=1}
 rx.fillStyle='#fff';rx.beginPath();rx.moveTo(c,c-8);rx.lineTo(c-6,c+6);rx.lineTo(c+6,c+6);rx.fill()}
/* main loop */
let frame=0;
function tick(now){const dt=Math.min(.1,(now-lastT)/1000);lastT=now;fps+=(1/dt-fps)*.1;frame++;
 if(frame%3==0){motionScan()}if(frame%2==0)fuse();
 simT-=dt;if(sim&&simT<=0&&tracks.filter(t=>t.sim).length<4){const s=SIMT[(Math.random()*SIMT.length)|0],b=Math.random()*360;tracks.push({id:nid++,n:s[0],sim:true,bear:b,rng:3800+Math.random()*700,spd:s[1],thr:3,el:5+Math.random()*28,conf:.9+Math.random()*.09,trail:[],lock:0,miss:0,vx:0,vy:0,cx:.5,cy:.5,w:.03,h:.03,friendly:false,dead:0});log('RADAR CONTACT '+s[0]+' BRG '+pad(b),'e');beep(1500,.12);beep(1100,.12);simT=7+Math.random()*7}
 derive(dt);
 /* auto behaviour per ROE */
 if(roe>0&&!sel){const c=tracks.filter(t=>!t.dead&&!t.friendly&&t.thr>=3&&(t.sim||t.rng<9999)).sort((a,b)=>a.rng-b.rng)[0];if(c){sel=c.id;log('AUTO-DESIGNATE TRK-'+pad(c.id),'w')}}
 const st=tracks.find(t=>t.id===sel);if(st&&st.lock>=1&&!st.beeped){st.beeped=1;beep(1800,.25,'sine',.06);log('LOCK ACQUIRED TRK-'+pad(st.id),'w')}if(st&&st.lock<1)st.beeped=0;
 fcool-=dt;if(roe==2&&st&&st.lock>=1&&!st.friendly&&!shots.length&&fcool<=0&&missiles>0){fcool=1.5;const m=manual;manual=true;fire();manual=m}
 /* shots */
 for(const s of shots){s.p+=dt/.95;const t=s.t,[tx,ty]=pos(t),e=s.p*s.p*(3-2*s.p),sx=W/2,sy=H+20,mx=sx+(tx-sx)*e+Math.sin(s.p*6)*18*(1-s.p),my=sy+(ty-sy)*e;s.x=mx;s.y=my;s.tr.push([mx,my]);if(s.tr.length>40)s.tr.shift();if(s.p>=1){s.done=1;if(tracks.includes(t)&&!t.dead)explode(t)}}shots=shots.filter(s=>!s.done);
 /* draw */
 x.clearRect(0,0,W,H);
 if(flash>0){x.fillStyle='rgba(255,'+(flash>.5?200:60)+',0,'+flash*.35+')';x.fillRect(0,0,W,H);flash-=dt*1.4}
 const crit=tracks.some(t=>!t.dead&&!t.friendly&&t.thr>=3);if(crit){x.strokeStyle='rgba(255,59,59,'+(.35+.35*Math.sin(now/150))+')';x.lineWidth=10;x.strokeRect(0,0,W,H)}
 tape();reticle();x.font='11px monospace';
 for(const t of tracks){const c=col(t),[bx,by,bw,bh]=box(t),[cx,cy]=pos(t);
  if(t.sim&&(t.cx<-.02||t.cx>1.02)){const L=t.cx<0;x.fillStyle=c;x.beginPath();const ex=L?14:W-14,ey=H/2;x.moveTo(ex,ey);x.lineTo(ex+(L?-0:0)+(L?14:-14),ey-12);x.lineTo(ex+(L?14:-14),ey+12);x.fill();x.textAlign=L?'left':'right';x.fillText(t.n+' '+pad(t.rng,4)+'m',L?32:W-32,ey+4);continue}
  const sz=Math.max(bw,26),bhh=Math.max(bh,26),X=cx-sz/2,Y=cy-bhh/2;
  x.strokeStyle=x.fillStyle=c;x.lineWidth=t.id===sel?2.5:1.5;x.globalAlpha=t.dead?.5:1;
  if(t.sim){x.beginPath();x.moveTo(cx,Y-4);x.lineTo(cx+sz/2+4,cy);x.lineTo(cx,Y+bhh+4);x.lineTo(cx-sz/2-4,cy);x.closePath();x.stroke()}else brk(X,Y,sz,bhh,Math.min(14,sz/3));
  x.beginPath();x.globalAlpha=.4;t.trail.forEach((p,i)=>{const m=pos({cx:p[0],cy:p[1]});i?x.lineTo(m[0],m[1]):x.moveTo(m[0],m[1])});x.stroke();x.globalAlpha=t.dead?.5:1;
  if(!t.sim&&(Math.abs(t.vx)+Math.abs(t.vy))>.05){x.setLineDash([3,4]);x.beginPath();x.moveTo(cx,cy);const m=vmap(t.cx+t.vx*.6,t.cy+t.vy*.6);x.lineTo(m[0],m[1]);x.stroke();x.setLineDash([])}
  x.textAlign='left';x.fillText('TRK-'+pad(t.id)+' '+t.n+' '+Math.round((t.conf||.9)*100)+'%',X,Y-16);x.fillText('IFF:'+(t.friendly?'FRD':t.thr>=3?'HOS?':'UNK')+' THR:'+lvl(t),X,Y-5);
  x.fillText('R'+pad(t.rng,4)+'m V'+pad(t.sv||0)+'m/s',X,Y+bhh+12);x.fillText('B'+pad(t.bear)+' E'+(t.el>=0?'+':'')+Math.round(t.el),X,Y+bhh+24);
  if(t.dead&&!t.sim){x.fillStyle='#ff3b3b';x.font='bold 16px monospace';x.fillText('NEUTRALIZED',X,cy);x.font='11px monospace'}
  if(t.id===sel&&!t.dead){const a=now/400;x.strokeStyle=t.lock>=1?'#ff3b3b':'#fff';x.lineWidth=2;const r=sz*.7+10+(t.lock<1?10*(1-t.lock):0);x.save();x.translate(cx,cy);x.rotate(t.lock>=1?0:a);x.strokeRect(-r,-r,r*2,r*2);x.restore();x.beginPath();x.arc(cx,cy,r+8,-1.57,-1.57+t.lock*6.283);x.stroke();
   x.fillStyle=t.lock>=1?(Math.sin(now/90)>0?'#ff3b3b':'#fff'):'#fff';x.textAlign='center';x.font='bold 13px monospace';x.fillText(t.lock>=1?'◆ LOCKED ◆':'ACQUIRING '+Math.round(t.lock*100)+'%',cx,cy+r+24);x.font='11px monospace'}
  x.globalAlpha=1}
 for(const s of shots){x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();s.tr.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,4,0,6.283);x.fill();x.fillStyle='#ffb000';x.beginPath();x.arc(s.x,s.y+4,3,0,6.283);x.fill()}
 for(const f of fx){if(f.ring){f.l-=dt*1.4;x.strokeStyle='rgba(255,200,80,'+Math.max(0,f.l)+')';x.lineWidth=3;x.beginPath();x.arc(f.x,f.y,(1-f.l)*140,0,6.283);x.stroke()}else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=140*dt;f.l-=dt*1.1;x.fillStyle=f.c;x.globalAlpha=Math.max(0,f.l);x.fillRect(f.x,f.y,3,3);x.globalAlpha=1}}fx=fx.filter(f=>f.l>0);
 radar(dt);
 if(frame%8==0)ui();
 requestAnimationFrame(tick)}
function ui(){const d=new Date(),live=tracks.filter(t=>!t.dead);
 $('#t1').textContent=d.toISOString().slice(0,10)+' '+d.toISOString().slice(11,19)+'Z';$('#t2').textContent='HDG '+pad(heading)+'° '+(hasComp?'MAG':'MAN')+' | '+gps+' | BAT '+batt+' | '+Math.round(fps)+'FPS';
 const hi=live.filter(t=>!t.friendly&&t.thr>=3).length,lv=hi?'CRITICAL':live.some(t=>!t.friendly&&t.thr==2)?'ELEVATED':live.length?'GUARDED':'NONE';
 $('#thr').innerHTML='THREAT: <b style="color:'+(hi?'#ff3b3b':lv=='ELEVATED'?'#ffb000':'#3dff8a')+'">'+lv+'</b>';$('#rs').textContent='TRKS '+live.length;
 const cells=Array.from({length:8},(_,i)=>i<missiles?'▮':'▯').join('');
 $('#stb').innerHTML=`<div class=row><span>OPTIC</span><span>${camOK?'ONLINE':'<i class=e>OFFLINE</i>'}</span></div><div class=row><span>CLASSIFIER</span><span>${model?'ONLINE '+Math.round(lat)+'ms':'<i class=w>MOTION</i>'}</span></div><div class=row><span>ROE</span><span class=w>${ROES[roe]}</span></div><div class=row><span>MAG</span><span>${cells}</span></div><div class=row><span>KILLS</span><span class=k>${kills}</span></div><div class=row><span>INTEGRITY</span><span class="${integ<40?'e':''}">${integ}%</span></div><div class=bar><i style="width:${integ}%;background:${integ<40?'#ff3b3b':'#3dff8a'}"></i></div>`;
 $('#tlb').innerHTML=live.sort((a,b)=>b.thr-a.thr).slice(0,7).map(t=>`<div style="color:${col(t)};${t.id===sel?'background:rgba(255,255,255,.15)':''}">${pad(t.id)} ${t.n.slice(0,15)} ${pad(t.rng,4)}m ${lvl(t)}</div>`).join('')||'<div style="opacity:.6">NO CONTACTS — SCANNING</div>'}
document.addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();fire()}if(e.key=='Tab'||e.key=='l'){e.preventDefault();lockNext()}if(e.key=='r')$('#bR').click()});
</script></body></html>
